version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: new_jaffle_shop
    description: Warehouse-backed Jaffle Shop e-commerce data replacing the local CSV seeds.
    tables:
      - name: customers
        description: One record per customer.
      - name: orders
        description: One record per order (consisting of one or more order items).
        config:
          loaded_at_field: ordered_at
      - name: items
        description: Items included in an order, one record per order item.
      - name: stores
        description: One record per store.
        config:
          loaded_at_field: opened_at
      - name: products
        description: One record per SKU for items sold in stores.
      - name: supplies
        description: One record per supply per SKU of items sold in stores.
